<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
<title id="title">Camera coordinates seen from above</title>
<desc id="desc">The camera faces toward the top of the drawing. Positive Y extends forward from its lens into the scene. Positive X is to the camera's right; negative X is left. A target forward and to the right has positive X and positive Y.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2328"/></marker></defs>
<rect width="600" height="420" rx="8" fill="#f6f8fa"/>
<g font-family="Arial, sans-serif" fill="#1f2328">
<text x="24" y="36" font-size="24" font-weight="bold">1. Look down from above</text>
<text x="300" y="82" font-size="22" text-anchor="middle">+Y: forward into the scene</text>
<path d="M300 300 V104" fill="none" stroke="#1f2328" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M300 300 H548" fill="none" stroke="#1f2328" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M300 300 H52" fill="none" stroke="#1f2328" stroke-width="3" marker-end="url(#arrow)"/>
<text x="478" y="333" font-size="21" text-anchor="middle">+X: right</text>
<text x="113" y="333" font-size="21" text-anchor="middle">−X: left</text>
<path d="M300 172 H452 V300" fill="none" stroke="#0969da" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="438" y="158" width="28" height="28" fill="#0969da"/>
<text x="412" y="130" font-size="20">Target</text>
<text x="334" y="220" font-size="19">X &gt; 0, Y &gt; 0</text>
<rect x="271" y="315" width="58" height="38" rx="5" fill="#d0d7de" stroke="#1f2328" stroke-width="2"/>
<rect x="288" y="300" width="24" height="15" fill="#d0d7de" stroke="#1f2328" stroke-width="2"/>
<circle cx="300" cy="300" r="5" fill="#1f2328"/>
<text x="300" y="381" font-size="20" text-anchor="middle">Camera lens = starting point (origin)</text>
<text x="300" y="407" font-size="17" text-anchor="middle">Z points up, out of this top-view drawing.</text>
</g></svg>
